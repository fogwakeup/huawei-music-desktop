<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.dbankcdn.cn https://*.tingmall.com https://*.kuke.com; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
    <title>任务栏播控条</title>
    <link rel="stylesheet" href="/mini.css" />
  </head>
  <body>
    <div class="mini-bar" id="mini-bar">
      <div class="mini-info" id="mini-info" title="拖动沿任务栏移动；双击展开主窗口">
        <span class="mini-cover" id="mini-cover-wrap">
          <img id="mini-cover" alt="" hidden />
          <svg id="mini-cover-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <span class="mini-text">
          <strong id="mini-title">尚未播放</strong>
          <small id="mini-artist">选择一首歌开始播放</small>
        </span>
      </div>
      <div class="mini-controls">
        <button data-action="previous" aria-label="上一首" title="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm12.5 0v14L9 12z"/></svg>
        </button>
        <button data-action="play-pause" class="mini-play" id="mini-play" aria-label="播放" title="播放 / 暂停">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button data-action="next" aria-label="下一首" title="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5.5 5v14L15 12z"/></svg>
        </button>
        <span class="mini-divider"></span>
        <button data-action="like" id="mini-like" aria-label="收藏当前歌曲" aria-pressed="false" title="收藏 / 取消收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4l1.4 1.4L12 21l7.4-6.6 1.4-1.4a5.2 5.2 0 0 0 0-7.4z"/></svg>
        </button>
        <button data-action="toggle-desktop-lyrics" id="mini-lyrics" aria-label="桌面歌词" aria-pressed="false" title="显示 / 隐藏桌面歌词">
          <span class="mini-lyric-glyph">词</span>
        </button>
        <button data-action="show-main" aria-label="展开主窗口" title="展开主窗口">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <button data-action="close" class="mini-close" aria-label="隐藏播控条" title="隐藏播控条（可在设置里重新打开）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <script type="module" src="/mini-main.ts"></script>
  </body>
</html>
